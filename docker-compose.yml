services:
  db:
    image: postgres:16-alpine
    deploy:
      resources:
        limits:
          memory: 256m
    environment:
      POSTGRES_USER: cookbook
      POSTGRES_PASSWORD: cookbook
      POSTGRES_DB: cookbook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          memory: 128m
    ports:
      - "6379:6379"

  # 语料库数据镜像（scratch 纯数据镜像，不参与 up 启动）
  # 构建：docker compose build corpus
  # 拉取：docker compose pull corpus
  corpus:
    image: cookbook/corpus:latest
    build:
      context: ./backend/data-image
    profiles: ["data"]

  api:
    build: ./backend
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      DATABASE_URL: postgresql+psycopg://cookbook:cookbook@db:5432/cookbook
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-me-0123456789abcdef
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

volumes:
  pgdata:
