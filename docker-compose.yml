services:
  db:
    image: postgres:16-alpine
    mac_address: 02:42:ac:14:00:0a
    deploy:
      resources:
        limits:
          memory: 256m
    environment:
      POSTGRES_USER: cookbook
      POSTGRES_PASSWORD: ${COOKBOOK_DB_PASSWORD}
      POSTGRES_DB: cookbook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    mac_address: 02:42:ac:14:00:0b
    deploy:
      resources:
        limits:
          memory: 128m
    ports:
      - "6379:6379"

  api:
    build: ./backend
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      DATABASE_URL: postgresql+psycopg://cookbook:${COOKBOOK_DB_PASSWORD}@db:5432/cookbook
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-me-0123456789abcdef
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"  # 仅本机可访问, 外网通过 nginx 反代

volumes:
  pgdata:
