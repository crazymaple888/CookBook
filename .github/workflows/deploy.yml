name: Deploy CookBook

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build web
        working-directory: app
        env:
          EXPO_PUBLIC_API_URL: http://web.nirvanamaple.cn/CookBook/api
        run: npm run build:web

      # 构建产物推到 dist 分支（GitHub 自动认证，无需任何 Secret）
      # 服务器侧 cron 每分钟拉取 dist 分支同步到网站目录
      - name: Push dist to dist branch
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # orphan 分支: 保留工作区文件, 不切换破坏产物
          git checkout --orphan dist
          # 先把产物移到根目录
          mv app/dist/* ./ 2>/dev/null || true
          mv app/dist/.[!.]* ./ 2>/dev/null || true
          # 清理源码目录
          rm -rf app backend README.md docker-compose.yml .github .gitignore 2>/dev/null || true
          git add -A
          git diff --cached --quiet && echo "无变更" || git commit -m "deploy dist $(date -u +%Y%m%d%H%M%S)"
          git push origin dist --force
